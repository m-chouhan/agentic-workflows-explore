server {
    server_name n8n.codenscious.com;
    # Note: HTTPS block already configured by certbot --nginx -d n8n.codenscious.com
    # Same n8n-risk-agent container as n8n.mchouhan.co.in (port 5679)

    location / {
        proxy_pass         http://localhost:5679;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Required for n8n long-poll (workflow wait nodes) and SSE
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/n8n.codenscious.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/n8n.codenscious.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name n8n.codenscious.com;
    return 301 https://$host$request_uri;
}
