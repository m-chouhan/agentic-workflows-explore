name: Box Setup

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - cloud/box-setup.sh

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CLOUD_SSH_KEY }}

      - name: Run box setup on server
        run: |
          scp -o StrictHostKeyChecking=no \
            cloud/box-setup.sh \
            root@${{ secrets.CLOUD_IP }}:~/box-setup.sh
          ssh -o StrictHostKeyChecking=no root@${{ secrets.CLOUD_IP }} "bash ~/box-setup.sh"
