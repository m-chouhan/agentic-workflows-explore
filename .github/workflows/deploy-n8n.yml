name: Deploy n8n Risk Agent to Contabo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - n8n-risk-agent/docker-compose.prod.yml
      - n8n-risk-agent/db/**
      - cloud/nginx/n8n-risk-agent.conf
      - cloud/box-setup.sh

# Required secrets: CLOUD_SSH_KEY, CLOUD_IP
# Required secrets (n8n-specific):
#   N8N_POSTGRES_PASSWORD, N8N_ENCRYPTION_KEY, N8N_BASIC_AUTH_USER, N8N_BASIC_AUTH_PASSWORD,
#   FINNHUB_API_KEY, GOOGLE_GENERATIVE_AI_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CLOUD_SSH_KEY }}

      - name: Ensure box is ready
        run: |
          scp -o StrictHostKeyChecking=no \
            cloud/box-setup.sh \
            root@${{ secrets.CLOUD_IP }}:~/box-setup.sh
          ssh -o StrictHostKeyChecking=no root@${{ secrets.CLOUD_IP }} "bash ~/box-setup.sh"

      - name: Write production .env
        working-directory: n8n-risk-agent
        run: |
          cat > .env.production << 'EOF'
          POSTGRES_USER=riskagent
          POSTGRES_PASSWORD=${{ secrets.N8N_POSTGRES_PASSWORD }}
          POSTGRES_DB=risk_factor
          N8N_HOST=n8n.mchouhan.co.in
          WEBHOOK_URL=https://n8n.mchouhan.co.in
          TIMEZONE=Asia/Kolkata
          N8N_ENCRYPTION_KEY=${{ secrets.N8N_ENCRYPTION_KEY }}
          N8N_BASIC_AUTH_USER=${{ secrets.N8N_BASIC_AUTH_USER }}
          N8N_BASIC_AUTH_PASSWORD=${{ secrets.N8N_BASIC_AUTH_PASSWORD }}
          FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY=${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          EOF

      - name: Deploy to server
        working-directory: n8n-risk-agent
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.CLOUD_IP }} \
            "mkdir -p /opt/n8n-risk-agent/db"
          scp -o StrictHostKeyChecking=no \
            .env.production \
            docker-compose.prod.yml \
            root@${{ secrets.CLOUD_IP }}:/opt/n8n-risk-agent/
          scp -o StrictHostKeyChecking=no \
            db/init-n8n-db.sql \
            db/schema.sql \
            db/seed.sql \
            root@${{ secrets.CLOUD_IP }}:/opt/n8n-risk-agent/db/
          ssh -o StrictHostKeyChecking=no root@${{ secrets.CLOUD_IP }} << 'ENDSSH'
            set -e
            mv /opt/n8n-risk-agent/.env.production /opt/n8n-risk-agent/.env
            cd /opt/n8n-risk-agent
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml down 2>/dev/null || true
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
          ENDSSH

      - name: Deploy nginx config
        run: |
          scp -o StrictHostKeyChecking=no \
            cloud/nginx/n8n-risk-agent.conf \
            root@${{ secrets.CLOUD_IP }}:/tmp/n8n-risk-agent.conf
          ssh -o StrictHostKeyChecking=no root@${{ secrets.CLOUD_IP }} << 'EOF'
            set -e
            mv /tmp/n8n-risk-agent.conf /etc/nginx/sites-available/n8n-risk-agent.conf
            ln -sf /etc/nginx/sites-available/n8n-risk-agent.conf /etc/nginx/sites-enabled/n8n-risk-agent.conf
            nginx -t && systemctl reload nginx
            echo "Nginx config deployed and reloaded"
          EOF

      - name: Health check
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.CLOUD_IP }} \
            "curl -sf --max-time 10 http://127.0.0.1:5679/healthz && echo OK"
