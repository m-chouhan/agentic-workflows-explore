name: Deploy Nginx Config — Agentic Platform

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - cloud/nginx/agentic-platform.conf

# Required secrets: CLOUD_SSH_KEY, CLOUD_IP

jobs:
  deploy-nginx:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.CLOUD_SSH_KEY }}

      - name: Deploy nginx config and reload
        run: |
          scp -o StrictHostKeyChecking=no \
            cloud/nginx/agentic-platform.conf \
            root@${{ secrets.CLOUD_IP }}:/tmp/agentic-platform.conf
          ssh -o StrictHostKeyChecking=no root@${{ secrets.CLOUD_IP }} << 'EOF'
            set -e
            mv /tmp/agentic-platform.conf /etc/nginx/sites-available/agentic-platform.conf
            ln -sf /etc/nginx/sites-available/agentic-platform.conf /etc/nginx/sites-enabled/agentic-platform.conf
            nginx -t && systemctl reload nginx
            echo "Nginx config deployed and reloaded"
          EOF

      - name: Health check
        run: |
          sleep 3
          curl -sf --max-time 10 http://${{ secrets.CLOUD_IP }}:3002/healthz \
            && echo "Health check passed" \
            || (echo "Health check failed — nginx reloaded but app may be down" && exit 1)
