name: Deploy DBOS Platform to Contabo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - dbos-agentic-platform/src/**
      - dbos-agentic-platform/Dockerfile
      - dbos-agentic-platform/docker-compose.prod.yml
      - dbos-agentic-platform/package*.json
      - dbos-agentic-platform/tsconfig.json
      - dbos-agentic-platform/.env.production

# Required secrets: CLOUD_SSH_KEY, CLOUD_IP, GOOGLE_GENERATIVE_AI_API_KEY

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbos-agentic-platform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CLOUD_SSH_KEY }}

      - name: Ensure box is ready
        working-directory: .
        run: |
          scp -o StrictHostKeyChecking=no \
            cloud/box-setup.sh \
            root@${{ secrets.CLOUD_IP }}:~/box-setup.sh
          ssh -o StrictHostKeyChecking=no root@${{ secrets.CLOUD_IP }} "bash ~/box-setup.sh"

      - name: Build Docker image
        run: docker build -t agentic-platform:latest .

      - name: Deploy to server
        run: |
          docker save agentic-platform:latest -o agentic-platform.tar
          echo "GOOGLE_GENERATIVE_AI_API_KEY=${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}" >> .env.production
          scp -o StrictHostKeyChecking=no \
            agentic-platform.tar \
            docker-compose.prod.yml \
            .env.production \
            root@${{ secrets.CLOUD_IP }}:~/
          ssh -o StrictHostKeyChecking=no root@${{ secrets.CLOUD_IP }} << 'ENDSSH'
            set -e
            mkdir -p /opt/agentic-platform
            docker load -i ~/agentic-platform.tar
            mv ~/.env.production /opt/agentic-platform/.env
            cp ~/docker-compose.prod.yml /opt/agentic-platform/
            cd /opt/agentic-platform
            docker compose -f docker-compose.prod.yml down 2>/dev/null || true
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
          ENDSSH

      - name: Health check
        working-directory: .
        run: |
          for i in $(seq 1 12); do
            echo "Attempt $i/12..."
            if curl -sf --max-time 10 http://${{ secrets.CLOUD_IP }}:3002/healthz; then
              echo "Health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after 2 minutes"
          ssh -o StrictHostKeyChecking=no root@${{ secrets.CLOUD_IP }} \
            "cd /opt/agentic-platform && docker compose -f docker-compose.prod.yml ps && docker compose -f docker-compose.prod.yml logs --tail 30"
          exit 1
