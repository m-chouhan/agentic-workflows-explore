services:
  postgres:
    image: postgres:16-alpine
    container_name: risk-agent-postgres
    restart: unless-stopped
    networks:
      - n8n-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-riskagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riskagent_pass}
      POSTGRES_DB: ${POSTGRES_DB:-risk_factor}
    ports:
      - "5433:5432"   # 5433 on host to avoid conflict with DBOS platform on 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-n8n-db.sql:/docker-entrypoint-initdb.d/00-n8n-db.sql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riskagent} -d ${POSTGRES_DB:-risk_factor}"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    # Pin to a specific version — check https://hub.docker.com/r/n8nio/n8n/tags for latest stable
    image: n8nio/n8n:1.88.0
    container_name: risk-agent-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678}

      # n8n state — Postgres, consistent with production
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n_state
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-riskagent}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-riskagent_pass}

      - GENERIC_TIMEZONE=${TIMEZONE:-Asia/Kolkata}
      - TZ=${TIMEZONE:-Asia/Kolkata}

      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_RUNNERS_ENABLED=true

      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change_me_in_production_32chars}

      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}

      # Postgres connection for n8n Postgres workflow nodes (app data)
      - APP_DB_HOST=postgres
      - APP_DB_PORT=5432
      - APP_DB_NAME=${POSTGRES_DB:-risk_factor}
      - APP_DB_USER=${POSTGRES_USER:-riskagent}
      - APP_DB_PASSWORD=${POSTGRES_PASSWORD:-riskagent_pass}

    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - n8n-net

networks:
  n8n-net:

volumes:
  postgres_data:
