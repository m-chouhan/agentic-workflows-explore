services:
  postgres:
    image: postgres:16
    container_name: poc-dbos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dbos
      POSTGRES_PASSWORD: dbos
      POSTGRES_DB: dbos_sales
    ports:
      - "5432:5432"
    volumes:
      - dbos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbos -d dbos_sales"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbos_pg_data:
