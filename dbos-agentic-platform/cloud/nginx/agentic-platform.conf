server {
    listen 80;
    server_name agents.mchouhan.co.in;

    location / {
        proxy_pass         http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for DBOS long-poll and SSE streaming
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
# Note: the HTTPS (443) block is added automatically by:
#   certbot --nginx -d agents.mchouhan.co.in
# Do not add ssl directives here manually.
