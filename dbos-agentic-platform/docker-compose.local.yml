# Local development stack — all services in one compose file.
# Usage:
#   cp .env.local.example .env.local
#   # Edit .env.local and add your GOOGLE_GENERATIVE_AI_API_KEY
#   docker compose -f docker-compose.local.yml --env-file .env.local up --build
#
# Services:
#   postgres     — PostgreSQL 16 (port 5432)
#   worker       — DBOS durable workflow executor (applies schema on boot)
#   app-server   — Express API server (port 3002)

services:
  # ── Database ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: local-dbos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dbos
      POSTGRES_PASSWORD: dbos
      POSTGRES_DB: dbos_platform
    ports:
      - "5432:5432"
    volumes:
      - local_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbos -d dbos_platform"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - local-net

  # ── DBOS Worker (workflow executor) ─────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-dbos-worker
    command: node dist/src/worker.js
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: dbos
      PGPASSWORD: dbos
      PGDATABASE: dbos_platform
      DBOS_EXECUTOR_ID: local-worker-1
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-2.5-flash-preview-04-17}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    networks:
      - local-net

  # ── Express API Server ───────────────────────────────────────────────────────
  app-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-dbos-server
    command: node dist/src/server.js
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: dbos
      PGPASSWORD: dbos
      PGDATABASE: dbos_platform
    networks:
      - local-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  local-net:

volumes:
  local_pg_data:
