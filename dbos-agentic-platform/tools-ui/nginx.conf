server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the DBOS app-server (same Docker network)
    location /workflow/ {
        proxy_pass         http://app-server:3000/workflow/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Healthcheck endpoint (proxied from app-server)
    location /healthz {
        proxy_pass http://app-server:3000/healthz;
    }

    # SPA — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
