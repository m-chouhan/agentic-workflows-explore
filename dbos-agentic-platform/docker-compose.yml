services:
  postgres:
    image: postgres:16
    container_name: dbos-agentic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dbos
      POSTGRES_PASSWORD: dbos
      POSTGRES_DB: dbos_platform
    ports:
      - "5432:5432"
    volumes:
      - dbos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbos -d dbos_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dbos-net

  worker:
    build: .
    command: node dist/src/worker.js
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # App only ever reads .env. Select an environment by copying it into place first:
    #   cp .env.local .env   (or .env.stg / .env.prod) before `docker compose up`.
    env_file:
      - .env
    environment:
      # Container-internal overrides (postgres hostname differs from local dev).
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: dbos
      PGPASSWORD: dbos
      PGDATABASE: dbos_platform
      DBOS_EXECUTOR_ID: worker-1
    networks:
      - dbos-net

  app-server:
    build: .
    command: node dist/src/server.js
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3000"
    # App only ever reads .env (see worker note above).
    env_file:
      - .env
    environment:
      # Container-internal overrides (postgres hostname differs from local dev).
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: dbos
      PGPASSWORD: dbos
      PGDATABASE: dbos_platform
    networks:
      - dbos-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  dbos-net:

volumes:
  dbos_pg_data:  # wipe with: docker compose down -v  (destroys all scan history)
