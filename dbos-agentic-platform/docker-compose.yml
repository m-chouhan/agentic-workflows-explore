services:
  postgres:
    image: postgres:16
    container_name: dbos-agentic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dbos
      POSTGRES_PASSWORD: dbos
      POSTGRES_DB: dbos_sales
    ports:
      - "5432:5432"
    volumes:
      - dbos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbos -d dbos_sales"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dbos-net

  worker:
    build: .
    command: node dist/src/worker.js
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: dbos
      PGPASSWORD: dbos
      PGDATABASE: dbos_sales
      DBOS_EXECUTOR_ID: worker-1
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-flash-latest}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    networks:
      - dbos-net

  app-server:
    build: .
    command: node dist/src/server.js
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: dbos
      PGPASSWORD: dbos
      PGDATABASE: dbos_sales
    networks:
      - dbos-net

networks:
  dbos-net:

volumes:
  dbos_pg_data:
